spring.application.name=ev-charging-station

# ---------------------------------------------------------------------------
# In-Memory H2 Database (Dev & Local Simulation Profile)
# Allows immediate local execution with zero manual database setup
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:ev_charging_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.open-in-view=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Booking rules
ev.booking.grace-period-minutes=5
ev.booking.reminder-before-minutes=2
ev.scheduler.expiry-check-rate-ms=30000
ev.scheduler.reminder-check-rate-ms=30000

server.port=8080
