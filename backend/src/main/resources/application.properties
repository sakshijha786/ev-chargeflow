spring.application.name=ev-charging-station

# Set active profile (default to dev for zero-setup in-memory database, switch to prod for MySQL/PostgreSQL)
spring.profiles.active=dev

# ---------------------------------------------------------------------------
# Database Configuration (MySQL / Production)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ev_charging_db}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ---------------------------------------------------------------------------
# Mail (confirmation / reminder / cancellation / queue-allocation emails)
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:your-email@gmail.com}
spring.mail.password=${MAIL_PASS:your-16-char-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------------
# Booking rules & Deterministic Schedulers
# ---------------------------------------------------------------------------
ev.booking.grace-period-minutes=5
ev.booking.reminder-before-minutes=2
ev.scheduler.expiry-check-rate-ms=30000
ev.scheduler.reminder-check-rate-ms=30000

server.port=8080
