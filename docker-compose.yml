version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ev-chargeflow-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ev_charging_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ev-chargeflow-api
    restart: on-failure
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ev_charging_db
      DB_USER: root
      DB_PASSWORD: rootpassword
      SPRING_PROFILES_ACTIVE: prod

volumes:
  mysql-data:
